services:
  larachan:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: larachan
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html

    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_DATABASE: school
      DB_USERNAME: root
      DB_PASSWORD: admin123

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - app_network

networks:
  app_network:
    driver: bridge
